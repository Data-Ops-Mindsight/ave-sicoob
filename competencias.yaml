# Descrição de cada competência (exibida na aba "Competências"). A chave deve ser igual ao nome usado acima.
temas:
  "Cultura e cooperativismo": "Adaptação à cultura, às normas e aos valores da cooperativa e aplicação dos princípios do cooperativismo no dia a dia."
  "Clima e relacionamento": "Integração à equipe, relacionamentos profissionais positivos e contribuição para um clima colaborativo e respeitoso."
  "Clareza do papel e domínio técnico": "Compreensão das responsabilidades e expectativas do cargo e domínio das ferramentas, sistemas e processos."
  "Proatividade e aprendizado": "Iniciativa, busca de aprendizado e desenvolvimento contínuo com autonomia."
  "Responsabilidade e organização": "Cumprimento de prazos e compromissos, pontualidade, planejamento e gestão do tempo e das prioridades."
  "Comunicação e feedback": "Comunicação clara e respeitosa, abertura para receber feedbacks e para pedir ajuda."
  "Equilíbrio e adaptabilidade": "Equilíbrio emocional, motivação e adaptação a mudanças de prioridade e a situações de pressão."
  "Resultados e qualidade": "Atingimento dos resultados e qualidade das entregas esperados para o cargo e o período."
  "Evolução e autonomia": "Evolução percebida do desempenho e crescente autonomia na execução das atividades."
  "Melhoria de processos": "Identificação de oportunidades e proposição de melhorias nas rotinas e processos da área."
  "Visão e impacto organizacional": "Compreensão do impacto do trabalho nos resultados da área e da cooperativa e alinhamento ao propósito."
  "Potencial": "Potencial para assumir maiores responsabilidades no futuro (avaliado só pelo gestor, aos 90 dias)."
